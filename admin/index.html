<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestellungen - Sternenpfade Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <h1>Bestellungen - Sternenpfade Admin</h1>
            <a href="new-order.html" class="btn btn-green" style="font-weight: 600;">➕ Neue Bestellung anlegen</a>
        </header>

        <!-- Premium Dashboard Stats -->
        <div class="dashboard-stats">
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(76, 175, 80, 0.1); color: #4CAF50;">📈</div>
                <div class="stat-info">
                    <span class="stat-label">Gesamtumsatz</span>
                    <span class="stat-value" id="statTotalRevenue">€ 0,00</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(33, 150, 243, 0.1); color: #2196F3;">💰</div>
                <div class="stat-info">
                    <span class="stat-label">Bezahlt</span>
                    <span class="stat-value" id="statPaidRevenue">€ 0,00</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(255, 152, 0, 0.1); color: #FF9800;">⏳</div>
                <div class="stat-info">
                    <span class="stat-label">Ausstehend</span>
                    <span class="stat-value" id="statPendingRevenue">€ 0,00</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: rgba(156, 39, 176, 0.1); color: #9C27B0;">🛒</div>
                <div class="stat-info">
                    <span class="stat-label">Bestellungen</span>
                    <span class="stat-value" id="statOrderCount">0</span>
                </div>
            </div>
        </div>

        <!-- Premium Monthly Charts -->
        <div class="dashboard-months-card">
            <h3>Umsatz nach Monaten</h3>
            <div class="dashboard-months" id="dashboardMonths">
                <div style="text-align: center; color: #777; width: 100%; padding: 20px;">Lade Umsatzdaten...</div>
            </div>
        </div>

        <div class="admin-toolbar">
            <div class="search-filters">
                <input type="text" id="searchInput" placeholder="Bestellungen suchen...">
                <select id="statusFilter">
                    <option value="">Alle (Bearbeitung)</option>
                    <option value="Offen">Offen</option>
                    <option value="Erledigt">Erledigt</option>
                </select>
                <select id="paymentFilter">
                    <option value="">Alle (Zahlung)</option>
                    <option value="Ausstehend">Ausstehend</option>
                    <option value="Bezahlt">Bezahlt</option>
                </select>
            </div>
        </div>

        <div class="table-container">
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>Status</th>
                        <th>Zahlung</th>
                        <th>Kunde</th>
                        <th>Datum</th>
                        <th>Zahlungsmethode</th>
                        <th>Gesamtsumme</th>
                        <th>Nr.</th>
                        <th>Aktionen</th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <!-- Orders will be loaded here via JS -->
                    <tr>
                        <td colspan="7" style="text-align: center;">Lade Bestellungen...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
